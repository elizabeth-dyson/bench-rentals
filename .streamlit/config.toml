[theme]
base = "light"
primaryColor = "#24543D"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F0F2ED"
textColor = "#252B28"
borderColor = "#D8DED6"
font = "sans-serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.125rem", "1rem", "0.875rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F0F2ED"
secondaryBackgroundColor = "#E5EAE2"
textColor = "#252B28"
primaryColor = "#24543D"
